apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Run R8 on release builds.
 *
 * Off, the app shipped 16 MB of dex: every class of React Native, AndroidX,
 * Fresco, OkHttp and the Kotlin standard library, the overwhelming majority
 * of which this app never calls. React Native's AAR carries the keep rules
 * for its own JNI and TurboModule surface, so what R8 needs from us is only
 * the handful of libraries that ship none -- see proguard-rules.pro.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.onemorerep"
    defaultConfig {
        applicationId "com.onemorerep"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Kept in step with package.json and APP_VERSION; a test fails if they
        // ever drift. versionCode is the integer Android orders builds by and
        // has to rise on every release, whatever the name says.
        versionCode 2
        versionName "1.1.0"
    }
    // Emulator architectures are dead weight on a phone. x86 and x86_64 were
    // 43 MB of the 91 MB APK -- half the download, for hardware no user of
    // this app has. Release therefore ships ARM only, split one APK per ABI,
    // so a device downloads the ~21 MB of native code it can actually run
    // instead of both instruction sets at once.
    //
    // Debug is deliberately left alone: it still packages x86_64, so the
    // local AVD keeps working, and it stays a single APK so `run-android`
    // has one artifact to install.
    splits {
        abi {
            enable gradle.startParameter.taskNames.any {
                it.toLowerCase().contains("release")
            }
            reset()
            // Overridable so a minified build can be put on the x86_64
            // emulator: R8 runs on release only, so an emulator that can only
            // load x86_64 is otherwise the one place its output cannot be
            // tested. `-PreleaseAbis=x86_64` builds exactly that, and
            // verify-apk.mjs still refuses to bless the result.
            include(*(project.findProperty("releaseAbis")
                ?: "arm64-v8a,armeabi-v7a").split(","))
            universalApk false
        }
    }

    // resources.arsc carried AndroidX's translations for some eighty locales.
    // The app's own strings are English only, and it does not offer a
    // language setting, so the rest is weight nobody reads.
    androidResources {
        localeFilters += ["en"]
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // Credentials live in ~/.gradle/gradle.properties, never in this
            // repo. The keystore itself is covered by .gitignore's *.keystore.
            if (project.hasProperty('ONEMOREREP_STORE_FILE')) {
                storeFile file(ONEMOREREP_STORE_FILE)
                storePassword ONEMOREREP_STORE_PASSWORD
                keyAlias ONEMOREREP_KEY_ALIAS
                keyPassword ONEMOREREP_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        debug {
            // Signed with the *release* key when one is configured.
            //
            // Android refuses to install a build whose signature differs from
            // the installed one; the only way past it is an uninstall, and an
            // uninstall takes the database with it. With the app in real use,
            // a debug build signed with the shared debug key would mean every
            // development install costs somebody their training history.
            //
            // Falls back to the debug key on a machine with no keystore, so
            // the project still builds for anyone who clones it.
            if (project.hasProperty('ONEMOREREP_STORE_FILE')) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
        release {
            // A release APK signed with the shared debug key installs fine and
            // looks fine, which is exactly what makes it dangerous to hand to
            // someone: anyone can forge an update over it, and it can never be
            // re-signed with a real key without an uninstall. So the fallback
            // is kept — a keyless machine can still build — but it announces
            // itself loudly rather than producing a shippable-looking artifact
            // in silence.
            if (project.hasProperty('ONEMOREREP_STORE_FILE')) {
                signingConfig signingConfigs.release
            } else {
                logger.warn("\n*** ONEMOREREP: signing release with the DEBUG " +
                    "key. Do not distribute this APK. Set ONEMOREREP_STORE_FILE " +
                    "in ~/.gradle/gradle.properties to sign it properly. ***\n")
                signingConfig signingConfigs.debug
            }
            minifyEnabled enableProguardInReleaseBuilds
            // Safe because the React Native Gradle plugin generates
            // res/raw/keep.xml naming every drawable that only JS references,
            // which is exactly what the shrinker cannot otherwise see.
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
